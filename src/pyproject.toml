[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scrnaseq-ici-htg"
version = "0.1.0"
description = "Stage 1 heterogeneous graph baseline for scRNA-seq ICI response prediction"
requires-python = ">=3.10"
dependencies = [
  "anndata>=0.10",
  "numpy>=1.26",
  "scanpy>=1.9",
  "scikit-learn>=1.3",
  "scipy>=1.11",
  "torch>=2.2",
  "torch-geometric>=2.5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
